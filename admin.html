<!DOCTYPE html>
<html lang="en" data-omni-admin>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Sign in — OmniMark Editor</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%234634F0'/%3E%3Ccircle cx='32' cy='32' r='15' fill='none' stroke='%23fff' stroke-width='7'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/admin.css">
</head>
<body>
<div id="login" class="login">
  <form class="login-card" id="loginForm" autocomplete="off" novalidate>
    <div class="brand">Omni<span>Mark</span> <em>editor</em></div>
    <p class="muted">Sign in to edit the real website directly. Drafts save automatically and stay private until you publish.</p>
    <label for="loginPw">Password</label>
    <div class="password-row">
      <input id="loginPw" type="password" autocomplete="current-password" aria-describedby="loginErr" aria-invalid="false" required autofocus>
      <button type="button" class="password-toggle" data-password-toggle="loginPw" aria-pressed="false">Show</button>
    </div>
    <p class="err" id="loginErr" role="alert" hidden></p>
    <button type="submit" class="btn primary block">Sign in</button>
    <a href="admin-advanced.html" class="admin-advanced-link">Advanced dashboard</a>
  </form>
</div>
<div id="noServer" class="login" hidden>
  <div class="login-card">
    <div class="brand">Omni<span>Mark</span> <em>editor</em></div>
    <p><strong>The editor needs the Node server.</strong></p>
    <p class="muted">Run <code>node server.js</code>, then return to <code>http://localhost:3000/admin</code>.</p>
  </div>
</div>
<script src="js/login.js"></script>
</body>
</html>
